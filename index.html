<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Circulação Linfática — Atlas Interativo</title>
<style>
:root{--f:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--r:14px}
[data-theme=dark]{--bg:#08161f;--panel:#10242f;--p2:#0c1d27;--ink:#e8eef2;--mut:#9db0bc;--line:#24414f;--ly:#e9b44c;--lys:rgba(233,180,76,.15);--vein:#5b8fd0;--rd:#58c4c4;--ok:#6fc3a3;--bad:#e5645a;--body:#12303e;--bl:#31596b;--on:#1a1405}
[data-theme=light]{--bg:#eef3f8;--panel:#fff;--p2:#f3f7fb;--ink:#0f172a;--mut:#51627a;--line:#cdd8e4;--ly:#b7791f;--lys:rgba(183,121,31,.13);--vein:#2563eb;--rd:#0f8a8a;--ok:#16825d;--bad:#d03a2f;--body:#dbe6ef;--bl:#8aa3b8;--on:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f);display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ly);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:800;white-space:nowrap}.brand em{color:var(--ly);font-style:normal}
.secs{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sec{padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:.82rem;font-weight:700;color:var(--mut);white-space:nowrap}
.sec b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);font-size:.72rem;margin-right:6px}
.sec.on{border-color:var(--ly);background:var(--lys);color:var(--ink)}.sec.on b{background:var(--ly);color:var(--on)}
.tool{padding:7px 11px;border:1px solid var(--line);border-radius:99px;font-size:.8rem;font-weight:600;color:var(--mut)}
.tool:hover{color:var(--ink);border-color:var(--ly)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;padding:14px}
.stage,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:0;display:flex;flex-direction:column}
.stage{padding:8px;position:relative;align-items:center}
.stage svg.body{flex:1;min-height:0;width:100%;max-width:420px}
.pill{font-size:.78rem;color:var(--mut);text-align:center;padding:4px 8px}
.panel{overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding:22px 24px}
.kick{font:700 .72rem var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ly);margin:0 0 6px}
h2{font-size:clamp(1.5rem,2.6vw,2.2rem);line-height:1.12;margin:0 0 12px}
h3{font-size:1.02rem;margin:16px 0 8px}
p{margin:0 0 .9em;max-width:64ch}
.lead{font-size:1.08rem;color:var(--mut)}
.view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h4{margin:0 0 4px;color:var(--ly);font-size:.92rem}.card p{margin:0;font-size:.88rem;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--p2);font-size:.84rem;color:var(--mut)}
.chip:hover{color:var(--ink);border-color:var(--ly)}.chip.on{background:var(--lys);border-color:var(--ly);color:var(--ly)}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--p2);font-weight:700;font-size:.85rem}
.btn:hover{border-color:var(--ly)}.btn.pri{background:var(--ly);border-color:var(--ly);color:var(--on)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.call{border-left:3px solid var(--ly);background:var(--lys);padding:10px 14px;border-radius:0 12px 12px 0;margin:12px 0;font-weight:600;font-size:.95rem}
.big{display:flex;gap:14px;align-items:center;background:var(--lys);border:1px solid var(--ly);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.big b{font-size:2.2rem;line-height:1;color:var(--ly)}.big span{font-size:.9rem;color:var(--mut)}
.bar{display:grid;grid-template-columns:7rem 1fr;gap:10px;align-items:center;font-size:.84rem;color:var(--mut);margin:6px 0}
.bar i{display:block;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--ly),transparent)}
dl.rows{margin:0;display:grid;gap:10px}dl.rows dt{font:700 .7rem var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--ly)}dl.rows dd{margin:0;font-size:.92rem}
canvas{width:100%;aspect-ratio:480/260;border-radius:12px;background:var(--p2);border:1px solid var(--line);display:block}
input[type=range]{width:100%;accent-color:var(--ly)}
.meter{height:9px;border-radius:99px;background:var(--p2);border:1px solid var(--line);overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;width:0;background:var(--ok);transition:.4s}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:relative;margin:26px 0 14px}
.track:before{content:"";position:absolute;left:10%;right:10%;top:17px;height:3px;background:var(--line)}
.track button{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.74rem;color:var(--mut);text-align:center;line-height:1.2}
.track b{width:36px;height:36px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center}
.track .pr{position:absolute;left:10%;top:17px;height:3px;width:0;background:var(--ly);transition:width .6s}
.track button{z-index:1}
.track .done b{border-color:var(--ly);color:var(--ly)}.track .on{color:var(--ink)}.track .on b{background:var(--ly);border-color:var(--ly);color:var(--on)}
.chk label{display:flex;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--p2);margin-bottom:6px;font-size:.88rem;cursor:pointer}
.chk input{accent-color:var(--ly);width:17px;height:17px;flex:none}
.opts{display:grid;gap:8px;margin:12px 0}.opts button{text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--p2)}
.opts button:hover:not(:disabled){border-color:var(--ly)}.opts .ok{border-color:var(--ok);background:rgba(111,195,163,.16)}.opts .no{border-color:var(--bad);background:rgba(229,100,90,.14)}
.foto{margin:0 0 12px}.foto img{width:100%;border-radius:12px;display:block}.foto figcaption{font-size:.72rem;color:var(--mut);padding-top:4px}
footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line);background:var(--panel)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:.25s}.dots i.on{width:22px;background:var(--ly)}.dots i.d{background:var(--ly);opacity:.5}
.small{font-size:.76rem;color:var(--mut)}.cnt{display:none;font-weight:700}
/* corpo */
.sil{fill:var(--body);stroke:var(--bl);stroke-width:3;stroke-linejoin:round}
.lung{fill:var(--p2);stroke:var(--line);opacity:.8}.heart{fill:rgba(214,95,82,.35);stroke:rgba(214,95,82,.6)}
.vein{fill:none;stroke:var(--vein);stroke-width:5;stroke-linecap:round;opacity:.5}
.vs path{fill:none;stroke:var(--ly);stroke-width:1.7;opacity:.55;stroke-linecap:round;stroke-linejoin:round}
.vs path.vr{stroke:var(--rd)}
.fp{fill:var(--ly)}.fp.vr{fill:var(--rd)}
.nd{cursor:pointer;outline:none}.nd .dot{fill:var(--ly);stroke:var(--bg);stroke-width:1;transition:.2s}.nd .hit{fill:transparent}
.nd:hover .dot,.nd.sel .dot{r:5.5;fill:#fff;stroke:var(--ly);stroke-width:2}
.m-flow .nd,.m-ducts .nd{opacity:.35;pointer-events:none}.m-nodes .fp{opacity:.35}
.duct,.lbl,.areas{display:none}
.m-ducts .duct,.m-ducts .lbl,.m-areas .duct,.m-areas .lbl{display:block}.m-areas .areas{display:block}.m-areas .nd{opacity:.3;pointer-events:none}
.duct .dt{fill:none;stroke:var(--ly);stroke-width:5;stroke-linecap:round}.duct .dr{fill:none;stroke:var(--rd);stroke-width:5;stroke-linecap:round}
.duct .cist{fill:var(--ly);stroke:#fff}.duct .ang{fill:#fff;stroke:var(--vein);stroke-width:3}
.foc-T .dr,.foc-T .vr{opacity:.15}.foc-R .dt,.foc-R .cist{opacity:.15}.foc-R .vt{opacity:.15}
.lbl text{font:600 10px var(--f);fill:var(--ink)}.lbl .t2{fill:var(--mut);font-weight:400}.lbl line{stroke:var(--mut);stroke-dasharray:2 2}
.areas .at{fill:rgba(233,180,76,.38)}.areas .ar{fill:rgba(88,196,196,.5)}
.swleg{display:none;fill:rgba(229,100,90,.32);stroke:var(--bad);stroke-width:2}.ede .swleg{display:block}.ede .fp.leg{display:none}.jam{display:none}.ede .jam{display:block}.halo,.mark{display:none}.ede .halo,.ede .mark{display:block}.ede .halo{animation:gl 1.6s infinite}
@keyframes gl{50%{opacity:.4}}
.inf .nd[data-k=cervical] .dot{r:7;fill:var(--bad);stroke:#fff;animation:sw 1.2s infinite}
@keyframes sw{50%{r:9}}.inf .focus{display:block}.focus{display:none}
@media(max-width:900px){html,body{height:auto;min-height:100%}body{display:block;overflow:visible}main{display:flex;flex-direction:column;padding:10px 10px 88px}.stage{height:44vh;min-height:300px}.scroll{overflow:visible;padding:18px 16px}.panel{overflow:visible}.brand,.tool.fs{display:none}header{flex-wrap:wrap;padding:6px 10px}.secs{order:3;flex:1 1 100%}.tool{margin-left:auto}.tool+.tool{margin-left:0}.grid{grid-template-columns:1fr}.track{font-size:.7rem}footer{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(0,0,0,.3)}.dots{display:none}.cnt{display:block}.btn{padding:10px 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
html.pres body{font-size:19px}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<path id="arm" d="M80 104 Q58 112 50 140 L34 296 Q34 308 48 308 Q60 308 62 296 L82 190 L98 130 Z"/>
<path id="leg" d="M100 296 Q94 380 104 470 Q108 540 108 612 Q108 628 124 628 Q138 628 138 612 Q138 540 142 470 Q150 390 148 296 Z"/>
<g id="sil"><ellipse cx="150" cy="46" rx="25" ry="30"/><rect x="138" y="70" width="24" height="30"/><path d="M92 100 Q150 88 208 100 L214 150 Q206 215 200 235 Q204 270 202 305 L98 305 Q96 270 100 235 Q94 215 86 150 Z"/><use href="#arm"/><use href="#arm" transform="translate(300 0) scale(-1 1)"/><use href="#leg"/><use href="#leg" transform="translate(300 0) scale(-1 1)"/></g>
<mask id="bm" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="640"><use href="#sil" fill="#fff"/></mask>
<clipPath id="bc"><use href="#sil"/></clipPath>
</defs></svg>

<header>
  <div class="brand">Circulação <em>linfática</em></div>
  <nav class="secs" id="secs"></nav>
  <button class="tool" id="play">▶ Fluxo</button>
  <button class="tool" id="theme">☀ Claro</button>
  <button class="tool fs" id="fs">⛶ Tela cheia</button>
</header>

<main>
  <section class="stage" aria-label="Modelo anatômico">
    <div id="fig" style="display:contents"></div>
    <div class="pill" id="pill"></div>
  </section>
  <section class="panel"><div class="scroll" id="scroll"></div></section>
</main>

<footer>
  <button class="btn" id="prev">← Anterior</button>
  <div class="dots" id="dots" aria-hidden="true"></div><span class="small cnt" id="cnt"></span>
  <button class="btn pri" id="next">Próximo →</button>
</footer>

{s:0,mode:'flow',pill:'Fluxo contínuo e unidirecional · Tecidos → Linfonodos → Ductos → Subclávias',html:function(){return '<p class="kick">Linfa</p><h2>O que é a linfa?</h2>'+foto('linfa')+'<p class="lead">Um líquido claro, geralmente transparente ou levemente amarelado, que circula pelo sistema linfático.</p><div class="grid"><div class="card"><h4>Rica em linfócitos</h4><p>Glóbulos brancos que participam da defesa do organismo.</p></div><div class="card"><h4>Recolhida nos tecidos</h4><p>Pelos capilares linfáticos, no espaço entre as células.</p></div><div class="card"><h4>Transportada por vasos</h4><p>Segue por vasos linfáticos até a corrente sanguínea.</p></div><div class="card"><h4>Fluxo unidirecional</h4><p>Sempre em direção à circulação sanguínea.</p></div></div>'}},
{s:0,mode:'flow',pill:'Quatro funções principais da linfa',html:function(){return '<p class="kick">Linfa</p><h2>Principais funções</h2><div class="grid"><div class="card"><h4>🛡 Defesa do organismo</h4><p>Transporta células de defesa que ajudam a combater microrganismos e infecções.</p></div><div class="card"><h4>⚖ Equilíbrio dos líquidos</h4><p>Recolhe o excesso de líquido dos tecidos e ajuda a evitar edemas.</p></div><div class="card"><h4>🧬 Transporte de substâncias</h4><p>Conduz proteínas e outras substâncias presentes nos tecidos.</p></div><div class="card"><h4>🔄 Retorno à circulação</h4><p>Devolve ao sangue o líquido recolhido dos espaços entre as células.</p></div></div>'}},
{s:0,mode:'flow',pill:'Importância da linfa · tente simular um bloqueio',html:function(){return '<p class="kick">Linfa</p><h2>Por que isso importa</h2><p class="lead">A linfa é fundamental para o equilíbrio dos líquidos corporais e para a proteção imunológica. Quando o transporte ou a drenagem é prejudicado, o líquido se acumula nos tecidos e causa <b>edema</b>.</p><div class="call">A linfa recolhe o excesso de líquido dos tecidos, transporta células de defesa e retorna à circulação sanguínea, contribuindo para o equilíbrio do organismo.</div><button class="btn bad" data-a="ede">💧 Simular obstrução / edema no modelo</button><div id="simimg"></div>'}},
{s:1,mode:'flow',pill:'Capilar linfático: fundo cego que recolhe o excesso de líquido',html:function(){return '<p class="kick">Capilares e vasos linfáticos</p><h2>Como a linfa se forma</h2>'+foto('capilar')+'<p>O capilar sanguíneo extravasa líquido para o tecido. O capilar linfático, de <b>fundo cego</b>, recolhe o excesso. Reduza a drenagem e veja o líquido se acumular.</p><canvas id="sim" width="480" height="260" role="img" aria-label="Simulação de formação da linfa"></canvas><label class="small" for="dr">Capacidade de drenagem: <b id="drv">100%</b></label><input type="range" id="dr" min="0" max="100" value="100"><div class="meter"><i id="mf"></i></div><p class="small" id="st" aria-live="polite"></p><div class="chips"><button class="chip" data-d="100">Normal</button><button class="chip" data-d="40">Obstrução parcial</button><button class="chip" data-d="0">Bloqueio</button></div>'}},
{s:1,mode:'flow',pill:'Vasos linfáticos: baixa pressão e válvulas unidirecionais',html:function(){return '<p class="kick">Capilares e vasos linfáticos</p><h2>Dos capilares aos vasos maiores</h2><p class="lead">Os vasos linfáticos começam como capilares finos nos tecidos e se fundem em vasos cada vez maiores até os ductos finais.</p><div class="grid"><div class="card"><h4>Baixa pressão</h4><p>A linfa viaja sob baixa pressão, impulsionada pelo movimento dos músculos ao redor.</p></div><div class="card"><h4>Válvulas</h4><p>Impedem o refluxo e mantêm o fluxo em um único sentido.</p></div><div class="card"><h4>Fusão progressiva</h4><p>Capilares → vasos coletores → troncos → ductos finais.</p></div><div class="card"><h4>Passagem por filtros</h4><p>No trajeto, os vasos passam pelos linfonodos.</p></div></div>'}},
{s:1,mode:'flow',pill:'Percurso completo da linfa até o sangue',html:function(){return '<p class="kick">Capilares e vasos linfáticos</p><h2>Fluxo contínuo e unidirecional</h2><p class="lead">Escolha uma etapa ou reproduza o trajeto.</p><div class="track" id="trk"><i class="pr" id="pr"></i>'+track.map(function(t,i){return '<button data-t="'+i+'"><b>'+(i+1)+'</b><span>'+t[0]+'</span></button>'}).join('')+'</div><div class="card" id="tbox" aria-live="polite" style="min-height:4.5rem"></div><p style="margin-top:12px"><button class="btn" id="tplay">▶ Reproduzir trajeto</button></p>'}},
{s:2,mode:'nodes',pill:'Toque em um grupo de linfonodos no corpo',html:function(){return '<p class="kick">Linfonodos</p><h2>Gânglios: filtros ao longo do caminho</h2>'+foto('linfonodos')+'<p>Órgãos linfoides secundários distribuídos por todo o corpo, geralmente próximos aos vasos linfáticos e a regiões de possível contato com microrganismos, como as cavidades oral e nasal.</p><div class="big"><b>≈ 450</b><span>linfonodos em um adulto jovem</span></div><div class="bar"><span>Abdome e pelve</span><i style="width:100%"></i></div><div class="bar"><span>Tórax</span><i style="width:62%"></i></div><div class="bar"><span>Cabeça e pescoço</span><i style="width:38%"></i></div><p class="small">Os mais fáceis de palpar: pescoço, axilas e virilha.</p>'}},
{s:2,mode:'nodes',pill:'Explore os 6 grupos regionais',html:function(){return '<p class="kick">Linfonodos</p><h2>Principais grupos regionais</h2><div class="chips" id="nchips">'+Object.keys(N).map(function(k){return '<button class="chip" data-k="'+k+'">'+N[k].n+'</button>'}).join('')+'</div><div class="card" id="ncard"><p>Escolha um grupo na lista ou no corpo.</p></div>'}},
{s:2,mode:'nodes',pill:'Linfadenopatia: aumento dos linfonodos',html:function(){return '<p class="kick">Linfonodos</p><h2>Quando os linfonodos aumentam</h2><p>Em processo inflamatório, infeccioso ou tumoral os linfonodos podem aumentar, o que se chama <b>linfadenopatia</b>. É importante investigar a causa.</p><button class="btn bad" data-a="inf">⚠ Simular linfadenopatia cervical</button><div id="simimg"></div><h3>Causas</h3><div class="chips"><button class="chip on" data-c="comuns">Mais comuns</button><button class="chip" data-c="serias">Mais sérias</button></div><div class="card" id="cbox"></div><h3>Sinais de atenção</h3><div class="chk" id="chk">'+['Aumento por mais de 3 semanas','Linfonodos endurecidos e imóveis','Crescem progressivamente','Perda de peso, febre ou suores noturnos','Aparecem em adulto sem causa aparente'].map(function(t){return '<label><input type="checkbox"> '+t+'</label>'}).join('')+'</div><p id="cout" aria-live="polite" style="font-weight:600">Nenhum sinal marcado.</p><p class="small">Ferramenta educativa. Não substitui avaliação médica.</p>'}},
{s:3,mode:'ducts',foc:'T',pill:'Ducto torácico: o maior coletor, drena ≈ ¾ do corpo',html:function(){return '<p class="kick">Ductos finais</p><h2>Ducto torácico, o maior coletor</h2>'+foto('ductos')+'<p>Os dois ductos finais são os maiores vasos linfáticos do corpo: o ducto torácico e o ducto linfático direito.</p><dl class="rows"><div><dt>Origem</dt><dd>Região abdominal, a partir da cisterna do quilo.</dd></div><div><dt>Trajeto</dt><dd>Sobe pelo mediastino posterior, paralelo à coluna e à aorta, até a base do pescoço.</dd></div><div><dt>Drena (≈ ¾)</dt><dd>Toda a metade inferior do corpo, lado esquerdo da cabeça e pescoço, membro superior esquerdo e metade esquerda do tórax.</dd></div><div><dt>Desemboca</dt><dd>Na junção da veia subclávia esquerda com a jugular interna esquerda.</dd></div></dl>'}},
{s:3,mode:'ducts',foc:'R',pill:'Ducto linfático direito: curto, drena o quadrante superior direito',html:function(){return '<p class="kick">Ductos finais</p><h2>Ducto linfático direito, o coletor menor</h2><dl class="rows"><div><dt>Tamanho</dt><dd>Vaso muito mais curto e menor, na base do pescoço, do lado direito.</dd></div><div><dt>Drena</dt><dd>Lado direito da cabeça e pescoço, membro superior direito e metade direita do tórax.</dd></div><div><dt>Desemboca</dt><dd>Na junção da veia subclávia direita com a jugular interna direita.</dd></div></dl><div class="call">Assimetria: ¾ do corpo pelo ducto torácico, ¼ pelo ducto linfático direito.</div><button class="btn" data-a="areas">Ver áreas de drenagem</button>'}},
{s:3,mode:'areas',pill:'Dourado: ducto torácico · Verde-água: ducto linfático direito',html:function(){return '<p class="kick">Ductos finais</p><h2>Onde a linfa volta ao sangue</h2><p>Nos <b>ângulos venosos</b> (subclávia + jugular interna), a linfa, sob baixa pressão, mistura-se ao sangue venoso que segue para o coração.</p><div class="call">Líquido, proteínas e células imunológicas voltam à circulação, mantendo o equilíbrio de fluidos e apoiando a função imunológica sistêmica.</div><p class="small">Fonte: NCBI Bookshelf, StatPearls — <a style="color:var(--ly)" href="https://www.ncbi.nlm.nih.gov/books/NBK513247/" target="_blank" rel="noopener">NBK513247</a>. Ilustrações esquemáticas e simplificadas.</p>'}},

function sim(){
  var cv=$('#sim'),c=cv.getContext('2d'),W=480,H=260,dr=1,d=[],L=[],acc=0,seed=7,last=0;
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
  var rg=$('#dr');function setD(v){dr=v/100;rg.value=v;$('#drv').textContent=v+'%'}
  rg.oninput=function(){setD(+rg.value)};$$('[data-d]',sc).forEach(function(b){b.onclick=function(){setD(+b.dataset.d)}});
  function step(dt){acc+=dt*2;while(acc>.14){acc-=.14;if(d.length<230)d.push({x:20+rnd()*240,y:62,vx:0,vy:20})}
    for(var k=d.length-1;k>=0;k--){var p=d[k],tx=Math.min(Math.max(p.x,250),440),dx=tx-p.x,dy=205-p.y,ds=Math.hypot(dx,dy)||1;
      p.vx+=(dx/ds*90+(rnd()-.5)*200)*dt*2;p.vy+=(dy/ds*90+(rnd()-.5)*200)*dt*2;p.vx*=.96;p.vy*=.96;p.x=Math.min(465,Math.max(10,p.x+p.vx*dt*2));p.y=Math.min(245,Math.max(70,p.y+p.vy*dt*2));
      if(ds<14&&rnd()<dr*3*dt){L.push({x:p.x});d.splice(k,1)}}
    for(k=L.length-1;k>=0;k--){L[k].x+=60*dt*2;if(L[k].x>490)L.splice(k,1)}}
  function draw(){var css=getComputedStyle(document.documentElement),ly=css.getPropertyValue('--ly').trim(),lv=Math.min(1,d.length/140);
    c.clearRect(0,0,W,H);c.fillStyle='rgba(121,191,230,'+(.04+lv*.18)+')';c.fillRect(0,70,W,190);
    c.fillStyle='#c9584d';c.fillRect(0,40,W,34);c.fillStyle='rgba(255,255,255,.75)';c.font='11px sans-serif';c.fillText('Capilar sanguíneo',8,61);
    c.strokeStyle=ly;c.lineWidth=2;c.beginPath();c.moveTo(480,190);c.lineTo(280,190);c.arc(280,205,15,-1.57,1.57,true);c.lineTo(480,220);c.stroke();
    c.fillStyle=ly;c.fillText('Capilar linfático (fundo cego)',290,184);L.forEach(function(p){c.beginPath();c.arc(p.x,205,4,0,6.3);c.fill()});
    c.fillStyle='#79bfe6';d.forEach(function(p){c.beginPath();c.arc(p.x,p.y,3.3,0,6.3);c.fill()});
    var n=d.length,s=n>110?2:n>50?1:0;$('#mf').style.width=Math.min(100,n/1.4)+'%';$('#mf').style.background=['var(--ok)','var(--ly)','var(--bad)'][s];
    $('#st').textContent=['Líquido no tecido: normal. O excesso é recolhido pelo capilar linfático.','Líquido aumentado: a drenagem não acompanha a produção.','Edema: o líquido se acumula entre as células e o tecido incha.'][s]}
  for(var w=0;w<600;w++)step(.016);draw();
  (function loop(t){if(!document.contains(cv))return;var dt=last?Math.min(.05,(t-last)/1000):.016;last=t;if(flow&&!reduce)step(dt);draw();requestAnimationFrame(loop)})(0);
}
function trk(){var cur=0,tm=null,bs=$$('#trk button'),pl=$('#tplay');
  var pts=[[118,560],[126,400],[150,245],[152,200],[176,100]],modes=['flow','flow','nodes','ducts','ducts'];
  function s(n){cur=n;bs.forEach(function(b,k){b.classList.toggle('on',k===n);b.classList.toggle('done',k<n)});
    $('#tbox').innerHTML='<b>'+(n+1)+'. '+track[n][0]+'</b><br>'+track[n][1];$('#pr').style.width=(n/4*80)+'%';
    cls.mode=modes[n];cls.sel='';paint();var m=$('#trkpt');if(m){m.setAttribute('cx',pts[n][0]);m.setAttribute('cy',pts[n][1]);m.style.display='block'}
    $('#pill').textContent=(n+1)+'/5 · '+track[n][0]}
  function stop(){clearInterval(tm);tm=null;pl.textContent='▶ Reproduzir trajeto'}
  bs.forEach(function(b,k){b.onclick=function(){stop();s(k)}});
  pl.onclick=function(){if(tm){stop();return}pl.textContent='⏸ Pausar';s(0);tm=setInterval(function(){if(cur>=4){stop();return}s(cur+1)},2400)};s(0)}
function quiz(){var k=0,sco=0,b=$('#qz');
  (function show(){if(k>=Q.length){b.innerHTML='<div class="call">Resultado: '+sco+' de '+Q.length+'</div><button class="btn pri" id="ag">Refazer</button>';$('#ag').onclick=function(){k=0;sco=0;show()};return}
    var q=Q[k];b.innerHTML='<p class="small">Pergunta '+(k+1)+' de '+Q.length+' · Acertos: '+sco+'</p><h3 style="margin-top:0">'+q[0]+'</h3><div class="opts">'+q[1].map(function(o,n){return '<button data-n="'+n+'">'+o+'</button>'}).join('')+'</div><p class="small" id="fb" aria-live="polite"></p><button class="btn" id="nq" hidden>'+(k===Q.length-1?'Ver resultado':'Próxima')+'</button>';
    $$('.opts button',b).forEach(function(x){x.onclick=function(){var ok=+x.dataset.n===q[2];if(ok)sco++;$$('.opts button',b).forEach(function(y,n){y.disabled=true;if(n===q[2])y.classList.add('ok');else if(y===x)y.classList.add('no')});$('#fb').textContent=(ok?'Correto. ':'Não é essa. ')+q[3];$('#nq').hidden=false;$('#nq').onclick=function(){k++;show()}}})})()}

/* ---- eventos globais ---- */
$('#secs').onclick=function(e){var b=e.target.closest('.sec');if(!b)return;for(var k=0;k<STEPS.length;k++)if(STEPS[k].s===+b.dataset.s){go(k);break}};
$('#prev').onclick=function(){go(i-1)};$('#next').onclick=function(){go(i+1)};
svg.addEventListener('click',function(e){var g=e.target.closest('.nd');if(!g)return;if(i!==7)go(7);selNode(g.dataset.k)});
svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('nd')){e.preventDefault();if(i!==7)go(7);selNode(e.target.dataset.k)}});
document.addEventListener('keydown',function(e){var t=(e.target.tagName||'').toLowerCase();if(t==='input'||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}});
$('#play').onclick=function(){flow=!flow;var ps=$$('animateMotion',svg);$('#play').textContent=flow?'⏸ Fluxo':'▶ Fluxo';flow?svg.unpauseAnimations():svg.pauseAnimations()};
if(reduce){flow=false;svg.pauseAnimations();$('#play').textContent='▶ Fluxo'}
$('#theme').onclick=function(){var l=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',l?'light':'dark');$('#theme').textContent=l?'🌙 Escuro':'☀ Claro'};
$('#fs').onclick=function(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}};
go(0);
})();
